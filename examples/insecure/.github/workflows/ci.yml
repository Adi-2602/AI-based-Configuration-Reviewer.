name: CI
on:
  pull_request_target:
  issues:
    types: [opened]

permissions: write-all

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: some-org/deploy-action@main
      - name: Greet
        run: |
          echo "New issue: ${{ github.event.issue.title }}"
      - name: Install tool
        run: curl -sL https://example.com/install.sh | bash
      - name: Debug
        run: |
          echo "token is ${{ secrets.DEPLOY_TOKEN }}"
