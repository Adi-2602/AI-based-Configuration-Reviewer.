# Hardened version of docker-compose.bad.yml
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.good
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
