name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q
      - name: Secure examples must pass the reviewer
        run: python -m config_reviewer examples/secure --fail-on high

  docker:
    name: Docker image build and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Review our own container configuration (dogfooding)
        run: |
          pip install -r requirements.txt
          python -m config_reviewer Dockerfile docker-compose.yml --fail-on low
      - name: Build image
        run: docker build -t ai-config-reviewer:ci .
      - name: Start container
        run: docker run -d --name reviewer -p 8000:8000 ai-config-reviewer:ci
      - name: Smoke test the running app
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/ | grep -q "AI Config Reviewer"
          curl -fsS -X POST http://127.0.0.1:8000/api/review \
            -H 'Content-Type: application/json' \
            -d '{"files":[{"name":"Dockerfile","content":"FROM python:latest\nCMD python app.py\n"}]}' \
            | python -c "import sys, json; d = json.load(sys.stdin); assert d['score'] < 100, d; print('score', d['score'], 'grade', d['grade'])"
          curl -fsS http://127.0.0.1:8000/api/stats | python -c "import sys, json; assert json.load(sys.stdin)['reviews'] == 1"
      - name: Container logs
        if: always()
        run: docker logs reviewer
